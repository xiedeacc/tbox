syntax = "proto3";

package tbox.proto;

message BaseConfig {
  string server_addr = 1;
  uint32 grpc_server_port = 2;
  uint32 http_server_port = 3;
  uint32 metric_ratio = 4;
  uint32 metric_interval_sec = 5;
  uint32 discard_ratio = 6;
  uint32 grpc_threads = 7;
  uint32 event_threads = 8;
  uint32 client_worker_thread_pool_size = 9;
  uint32 check_interval_seconds = 10;

  // Authentication credentials
  string user = 11;
  string password = 12;

  // Route53 settings for DNS update
  string route53_hosted_zone_id = 13;

  // Client identification
  string client_id = 14;

  // Client-requested domains for server-side DDNS management.
  repeated string monitor_domains = 15;

  // AWS credentials for Route53 access
  string aws_access_key_id = 16;
  string aws_secret_access_key = 17;
  string aws_region = 18;

  // Certificate update flag
  bool update_certs = 19;

  // Certificate paths
  string local_cert_path = 20;
  string nginx_ssl_path = 21;

  // DNS backend selection for DDNS updates.
  // Supported values: "route53", "cloudflare".
  // Defaults to "route53" when empty, preserving legacy behaviour.
  string dns_provider = 22;

  // Cloudflare credentials and zone for DNS access.
  // cloudflare_zone_id is optional; when empty the zone is resolved by
  // querying the Cloudflare API for the domain's registrable name.
  string cloudflare_api_token = 23;
  string cloudflare_zone_id = 24;

  // Client-requested DNS record types. Empty means both A and AAAA.
  repeated string ddns_record_types = 25;

  // Embedded vlmcsd TCP server settings.
  bool vlmcsd_enabled = 26;
  repeated string vlmcsd_listen_addresses = 27;

  // Certificate files synchronized from the server when update_certs is true.
  repeated string certificate_files = 28;

  // Shared Ed25519 SSH identity used for mutual login proof.
  string ssh_private_key_path = 29;
  string ssh_public_key_path = 30;

  // Client IDs authorized to retrieve certificate files.
  repeated string certificate_sync_client_ids = 31;

  // Certificate source (server) or destination (client) directory.
  string certificate_path = 32;
}
